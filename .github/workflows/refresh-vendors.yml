name: Refresh vendor lists
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    # macOS so the SF Symbols catalogue in CoreGlyphs.bundle is available.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fetch
      - name: Summarize changes
        id: diff
        run: |
          if git diff --quiet -- vendor; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'Vendor name lists refreshed by the weekly workflow.'
            echo
            echo '## Versions'
            echo '```'
            node bin/rosetta.ts --libraries
            echo '```'
            echo
            echo '## Validation'
            echo '```'
            npm run --silent validate || true
            echo '```'
            echo
            echo 'Errors above mean a curated mapping points at a name the vendor no longer ships; fix them in `data/icons/` before merging.'
          } > /tmp/pr-body.md
      - name: Rebuild dataset
        if: steps.diff.outputs.changed == 'true'
        run: npm run build || true
      - uses: peter-evans/create-pull-request@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          branch: bot/refresh-vendors
          title: Refresh vendor name lists
          body-path: /tmp/pr-body.md
          commit-message: |
            Refresh vendor name lists

            Co-Authored-By: GitHub Actions <actions@github.com>
          labels: vendor-refresh
