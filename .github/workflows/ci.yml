name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Compiled dataset matches source
        run: git diff --exit-code -- dist src/data.generated.ts
