id: lucide
name: Lucide
vendor: Lucide Contributors
homepage: https://lucide.dev
naming: kebab-case
example: arrow-right
usage:
  react: '<{Pascal} />  // import { {Pascal} } from "lucide-react"'
  web: '<i data-lucide="{name}"></i>'
  static: 'lucide-static/icons/{name}.svg'
styles:
  fill:
    kind: none
    note: 'Lucide is stroke-only; a fill request falls back to the outline with `exact: false`.'
notes:
  - 'Lucide renamed many icons shape-first (`check-circle` → `circle-check`); old names stay valid as aliases and vendor/lucide.json carries them.'
