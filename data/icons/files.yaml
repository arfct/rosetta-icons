# Documents, folders and storage.
folder:
  aliases: [directory, organize]
  sf: folder
  material: folder
  lucide: folder
  heroicons: folder
folder-open:
  sf: { name: folder, match: approximate, note: SF has no open-folder glyph }
  material: folder_open
  lucide: folder-open
  heroicons: folder-open
folder-plus:
  aliases: [new-folder, create-new-folder, add-folder]
  sf: folder.badge.plus
  material: create_new_folder
  lucide: folder-plus
  heroicons: folder-plus
file:
  aliases: [document, doc, page, blank-file]
  sf: doc
  material: draft
  lucide: file
  heroicons: document
file-text:
  aliases: [document-text, text-file, article, description]
  sf: doc.text
  material: description
  lucide: file-text
  heroicons: document-text
file-plus:
  aliases: [new-file, add-file, note-add]
  sf: doc.badge.plus
  material: note_add
  lucide: file-plus
  heroicons: document-plus
file-check:
  aliases: [task-file, approved-document]
  sf: { name: doc.text, match: approximate, note: SF has no checked-document glyph }
  material: task
  lucide: file-check
  heroicons: document-check
file-code:
  aliases: [code-file, source-file]
  sf: doc.text.below.ecg
  material: { name: code_blocks, match: close }
  lucide: file-code
file-image:
  aliases: [image-file, picture-file]
  sf: doc.richtext
  material: imagesmode
  lucide: file-image
files:
  aliases: [documents, multiple-files, file-stack, pages]
  sf: { name: doc.on.doc, match: close }
  material: file_copy
  lucide: files
  heroicons: { name: document-duplicate, match: close }
cloud:
  aliases: [cloud-storage, icloud-generic]
  sf: cloud
  material: cloud
  lucide: cloud
  heroicons: cloud
cloud-upload:
  aliases: [backup, cloud-sync-up]
  sf: { name: icloud.and.arrow.up, note: Apple restricts icloud symbols to referring to iCloud; there is no generic cloud-arrow glyph }
  material: cloud_upload
  lucide: cloud-upload
  heroicons: cloud-arrow-up
cloud-download:
  aliases: [cloud-sync-down, restore]
  sf: { name: icloud.and.arrow.down, note: Apple restricts icloud symbols to referring to iCloud; there is no generic cloud-arrow glyph }
  material: cloud_download
  lucide: cloud-download
  heroicons: cloud-arrow-down
cloud-off:
  aliases: [offline, cloud-slash, no-cloud]
  sf: { name: icloud.slash, note: Apple restricts icloud symbols to referring to iCloud }
  material: cloud_off
  lucide: cloud-off
database:
  aliases: [db, storage, data, cylinder]
  sf: cylinder.split.1x2
  material: database
  lucide: database
  heroicons: circle-stack
hard-drive:
  aliases: [disk, drive, storage-drive, hdd, external-drive]
